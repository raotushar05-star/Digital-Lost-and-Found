server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: lost-and-found-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lostandfound}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-only-secret-key-please-replace-in-production-min-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  file-storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:/api/v1/files}
  matching:
    minimum-score: 40.0
  seed:
    admin-email: ${SEED_ADMIN_EMAIL:admin@lostandfound.local}
    admin-phone: ${SEED_ADMIN_PHONE:9999999999}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@12345}

logging:
  level:
    com.lostandfound: INFO
    org.springframework.security: WARN
