version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lost-and-found-db
    environment:
      POSTGRES_DB: lostandfound
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - lf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lf_pgdata:
